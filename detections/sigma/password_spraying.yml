title: Password Spraying via Kerberos
id: 8827e22a-4f1a-4b45-9b24-af4a3d9c7b1f
status: experimental
description: >
  Detects password spraying attacks against Active Directory via Kerberos.
  Password spraying tries one password against many accounts to avoid lockouts.
  The pattern is many TGT requests (Event 4768) or pre-auth failures (Event 4771)
  from the same source IP targeting different accounts within a short time window.
author: Nandini Bhuva
date: 2026/11/06
references:
  - https://attack.mitre.org/techniques/T1110/003/
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4768
      - 4771
  timeframe: 1m
  condition: selection | count(TargetUserName) by IpAddress > 5
falsepositives:
  - Automated systems authenticating multiple service accounts simultaneously
  - Misconfigured applications doing bulk authentication
  - Legitimate monitoring tools
level: high
fields:
  - EventID
  - TargetUserName
  - IpAddress
  - TicketEncryptionType
